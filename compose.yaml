services:
  codetic-api:
    build: .
    env_file: .env
    environment:
      # Development API only. Use compose.production.yaml for HTTPS deployment.
      NODE_ENV: development
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3101:3101"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - codetic
networks:
  codetic:
